[project]
name = "keef"
version = "0.1.0"
description = "CLI para atualização segura de bibliotecas musicais"
authors = [
    { name = "Luan Motta", email = "luanmtt12@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
]

[project.scripts]
keef = "keef:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
